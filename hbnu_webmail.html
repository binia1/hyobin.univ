<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹메일 - 효빈대학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md border border-gray-200">
        <div class="text-center mb-8">
            <a href="hbnu_main.html" class="inline-flex items-center text-[#3344aa] font-bold text-2xl mb-2">
                <img src="images/logo.png" onerror="this.src='https://via.placeholder.com/32?text=H'" class="w-8 h-8 mr-2 rounded-md">
                HBNU Mail
            </a>
            <p class="text-gray-500 text-sm">효빈대학교 웹메일 시스템입니다.</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('로그인 성공!'); location.href='hbnu_main.html';" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">이메일 주소</label>
                <div class="relative">
                    <input type="text" placeholder="ID" class="w-full pl-10 pr-4 py-3 border rounded-lg outline-none focus:border-[#3344aa] focus:ring-1 focus:ring-[#3344aa]">
                    <i data-lucide="mail" class="w-5 h-5 text-gray-400 absolute left-3 top-3.5"></i>
                    <span class="absolute right-4 top-3.5 text-gray-500 text-sm">@hbnu.ac.kr</span>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                <div class="relative">
                    <input type="password" placeholder="Password" class="w-full pl-10 pr-4 py-3 border rounded-lg outline-none focus:border-[#3344aa] focus:ring-1 focus:ring-[#3344aa]">
                    <i data-lucide="lock" class="w-5 h-5 text-gray-400 absolute left-3 top-3.5"></i>
                </div>
            </div>
            <div class="flex items-center justify-between text-xs text-gray-500">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" class="mr-2 rounded border-gray-300 text-[#3344aa] focus:ring-[#3344aa]"> 로그인 상태 유지
                </label>
                <a href="#" class="hover:text-[#3344aa] hover:underline">비밀번호 찾기</a>
            </div>
            <button type="submit" class="w-full bg-[#3344aa] text-white py-3 rounded-lg font-bold hover:bg-[#2a3a9a] transition shadow-md">
                로그인
            </button>
        </form>

        <div class="mt-8 pt-6 border-t text-center text-xs text-gray-400">
            <p>신규 교직원 및 신입생은 포털에서 계정 생성 후 이용 가능합니다.</p>
            <p class="mt-2">COPYRIGHT © 2025 HBNU. ALL RIGHTS RESERVED.</p>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script src="common.js"></script>
</body>
</html>
