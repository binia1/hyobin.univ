    <style>

<body class="bg-gray-50 flex flex-col min-h-screen overflow-x-hidden">

            <p class="text-gray-600 mb-8 text-lg">효빈대학교 대학원의 7개 계열, 심화 과정을 담당하는 모든 전공을 소개합니다.</p>
            
            <!-- 학과 검색창 -->
            <div class="max-w-2xl mx-auto relative group">
                <input type="text" id="dept-search" placeholder="대학원 전공명 또는 계열명을 검색하세요 (예: 복지, 반도체)" 
                       class="w-full pl-12 pr-4 py-4 border border-gray-300 rounded-full shadow-sm focus:outline-none focus:ring-2 focus:ring-[#3344aa] focus:border-transparent transition text-gray-700 text-lg"
                       oninput="filterDepartments(this.value)">
                <i data-lucide="search" class="absolute left-4 top-4 text-gray-400 group-focus-within:text-[#3344aa] transition-colors w-6 h-6"></i>
            </div>
        </div>

        <!-- 데이터 렌더링 영역 -->

            <!-- JavaScript를 통해 대학원 목록이 동적 생성됩니다. -->
        </div>

        <!-- 범례 및 안내 -->
        <div class="mt-16 text-center text-sm text-gray-500 bg-white p-6 rounded-xl border shadow-sm">
            <p>※ 석사, 박사, 석박사 통합 과정 등 세부 학위 수여 과정은 각 학과 홈페이지 모집 요강을 참고해 주시기 바랍니다.</p>
            <p class="mt-2">※ 특수대학원 및 전문대학원은 일반대학원과 모집 일정이 다를 수 있습니다.</p>
        </div>
    </main>

        // ================= 렌더링 로직 =================
        function renderColleges(data) {
            const container = document.getElementById('colleges-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white border rounded-xl shadow-sm">
                        <i data-lucide="search-x" class="w-16 h-16 mx-auto text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-lg">검색된 대학원 전공이 없습니다.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            data.forEach(group => {
                const section = document.createElement('div');
                section.className = 'fade-in';
                section.innerHTML = `
                    <div class="flex items-center mb-6">
                        <div class="p-3 rounded-full ${group.bg} mr-4 shadow-sm border border-white">
                            <i data-lucide="${group.icon}" class="${group.color} w-6 h-6"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800 tracking-tight">${group.field}</h2>
                        <div class="h-px bg-gray-200 flex-grow ml-6"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${group.colleges.map(col => `
                            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden hover:shadow-lg transition-all duration-300 group">
                                <div class="bg-gray-50 px-5 py-4 border-b font-bold text-gray-800 group-hover:text-[#3344aa] transition-colors flex justify-between items-center">
                                    <span>${col.name}</span>
                                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 group-hover:text-[#3344aa]"></i>
                                </div>
                                <div class="p-5">
                                    <ul class="space-y-2.5">
                                        ${col.depts.map(dept => `
                                            <li onclick="goToDept('${dept}')" class="text-sm font-medium text-gray-600 hover:text-[#3344aa] hover:bg-blue-50 p-1.5 -mx-1.5 rounded cursor-pointer flex items-center transition-colors">
                                                <span class="w-1.5 h-1.5 bg-gray-300 rounded-full mr-2.5 group-hover:bg-[#3344aa]"></span>
                                                ${dept}
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
            lucide.createIcons();
        }

        // ================= 학과 상세 페이지 이동 =================
        function goToDept(deptName) {
            const cleanName = deptName.trim();

            // 특정 학과 파일 매핑
            const specialDepts = {
                "필리핀어학과": "hbnu_dept_filipino.html",
                "일어일문학과": "hbnu_dept_japanese.html",
                "철도운전학과": "hbnu_dept_railway.html",
                "사회복지경영학과": "hbnu_dept_sw_management.html",
                "사회복지정책학과": "hbnu_dept_sw_policy.html",
                "만화애니메이션학과": "hbnu_dept_animation.html"
            };

            if (specialDepts[cleanName]) {
                location.href = specialDepts[cleanName];
            } else {
                location.href = `대학원상세.html?dept=${encodeURIComponent(cleanName)}`;
            }
        }

        // ================= 검색 필터 로직 =================
        function filterDepartments(keyword) {
            const term = keyword.trim().toLowerCase();
            
            if (!term) {
                renderColleges(GRADUATE_DB);
                return;
            }

            // 검색어가 포함된 단과대나 학과가 있는 그룹만 필터링
            const filtered = GRADUATE_DB.map(group => {
                const matchingColleges = group.colleges.filter(col => {
                    const matchCollegeName = col.name.toLowerCase().includes(term);
                    const matchDept = col.depts.some(d => d.toLowerCase().includes(term));
                    return matchCollegeName || matchDept;
                }).map(col => col); 

                return { ...group, colleges: matchingColleges };
            }).filter(group => group.colleges.length > 0);

            renderColleges(filtered);
        }

        // 초기 렌더링
        document.addEventListener('DOMContentLoaded', () => {
            renderColleges(GRADUATE_DB);
        });

    <script src="common.js"></script>
</body>
</html>
