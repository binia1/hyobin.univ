<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 상세 - 효빈대학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <div id="header-area"></div>

    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-white border rounded-xl shadow-sm p-8 min-h-[600px]">
            <div id="content-loading" class="py-20 text-center text-gray-400">데이터를 불러오는 중...</div>
            <div id="content-body" class="hidden">
                <div class="border-b pb-6 mb-6">
                    <span id="notice-tag" class="inline-block px-2 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded mb-2">공지사항</span>
                    <h1 class="text-2xl font-bold text-gray-800 mb-4" id="notice-title"></h1>
                    <div class="flex justify-between text-sm text-gray-500">
                        <div class="flex space-x-4">
                            <span><span class="font-bold mr-1">작성자</span> 관리자</span>
                            <span><span class="font-bold mr-1">등록일</span> <span id="notice-date"></span></span>
                        </div>
                    </div>
                </div>
                <div class="prose max-w-none text-gray-700 leading-relaxed min-h-[300px] whitespace-pre-line" id="notice-detail">
                    <!-- 상세 내용이 이곳에 주입됩니다 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // 공지 데이터베이스 (ID 기반)
        const NOTICES_DB = {
            1001: "효빈 트램 7호선 효빈대입구역 정류장 위치가 정문 바로 앞으로 이전되었습니다. 이용에 착오 없으시길 바랍니다.",
            1002: "개교 100주년을 기념하여 효빈 타임캡슐 봉인식을 거행합니다. 재학생 여러분의 소망 메시지를 학생회실에서 접수하고 있습니다.",
            1003: "2025학년도 1학기 생활관 최종 합격자를 공지합니다. 합격자는 기간 내에 기숙사비를 납부하시기 바랍니다.",
            1004: "신입생 및 재학생용 모바일 학생증 발급이 시작되었습니다. 'HBNU 스마트 포털' 앱에서 신청 가능합니다.",
            1005: "시험기간을 맞아 중앙도서관 열람실을 24시간 개방합니다. 박효빈 시장님의 후원으로 야간 간식이 제공될 예정입니다.",
            2001: "2025학년도 1학기 수강신청 정정 기간은 3월 5일부터 3일간입니다.",
            2002: "군 전역 복학 신청 안내입니다. 증빙 서류를 지참하여 학과 사무실을 방문하세요.",
            3001: "효빈대학교에서 미래를 이끌어갈 우수한 교수님을 초빙합니다. 공학 및 사회복지 정책 분야 우대."
        };

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            // 데이터 로드 시뮬레이션
            if (id && NOTICES_DB[id]) {
                document.getElementById('content-loading').classList.add('hidden');
                document.getElementById('content-body').classList.remove('hidden');
                
                // 임시로 제목 생성 (원래는 데이터셋에서 가져와야 함)
                document.getElementById('notice-title').innerText = "해당 공지사항의 상세 안내입니다. (ID: " + id + ")";
                document.getElementById('notice-date').innerText = "2025.02.20";
                document.getElementById('notice-detail').innerText = NOTICES_DB[id];
            } else {
                document.getElementById('content-loading').innerText = "존재하지 않는 공지사항입니다.";
            }
            lucide.createIcons();
        };
    </script>
    <script src="common.js"></script>
</body>
</html>
