<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일무단수집거부 - 효빈대학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen overflow-x-hidden">

    <div id="header-area"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-20 w-full text-center">
        <div class="bg-white p-12 rounded-lg shadow-md border border-gray-200">
            <div class="flex justify-center mb-6">
                <div class="bg-red-100 p-4 rounded-full text-red-600">
                    <i data-lucide="mail-warning" class="w-12 h-12"></i>
                </div>
            </div>
            <h1 class="text-2xl font-black text-gray-800 mb-6">이메일 무단 수집 거부</h1>
            
            <p class="text-gray-600 leading-relaxed text-lg mb-8">
                본 웹사이트에 게시된 이메일 주소가 <br>
                <strong class="text-red-600 font-bold">전자우편 수집 프로그램이나 그 밖의 기술적 장치를 이용하여 무단으로 수집되는 것을 거부</strong>하며,<br>
                이를 위반시 정보통신망법에 의해 형사처벌됨을 유념하시기 바랍니다.
            </p>
            
            <div class="text-sm text-gray-500 bg-gray-50 p-4 rounded text-left">
                <strong>[정보통신망 이용촉진 및 정보보호 등에 관한 법률]</strong><br>
                제50조의2 (전자우편주소의 무단 수집행위 등 금지)<br>
                ① 누구든지 전자우편주소의 수집을 거부하는 의사가 명시된 인터넷 홈페이지에서 자동으로 전자우편주소를 수집하는 프로그램 그 밖의 기술적 장치를 이용하여 전자우편주소를 수집하여서는 아니된다.
            </div>
            
            <button onclick="location.href='메인.html'" class="mt-10 bg-[#3344aa] text-white px-8 py-3 rounded-lg font-bold hover:bg-[#2a3a9a] transition">
                메인으로 돌아가기
            </button>
        </div>
    </main>

    <footer id="footer-area" class="bg-[#2a2a2a] text-gray-400 py-12 text-sm mt-auto"></footer>

    <script src="common.js"></script>
</body>
</html>
