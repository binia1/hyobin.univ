<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효빈대학교 - HBNU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .slide-fade { transition: opacity 1s ease-in-out; }
        .fade-in-up { animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #3344aa; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a3a9a; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen overflow-x-hidden">

    <!-- 헤더 영역 -->
    <div id="header-area"></div>

    <!-- 메인 컨텐츠 영역 -->
    <main id="main-root" class="flex-grow fade-in-up"></main>

    <!-- 푸터 영역 -->
    <footer id="footer-area" class="bg-[#2a2a2a] text-gray-400 py-12 text-sm mt-auto"></footer>

    <!-- 모달 (팝업용) -->
    <div id="modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-50 p-4 hidden" onclick="closeModal()">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-black"><i data-lucide="x" width="24"></i></button>
            <h3 id="modal-title" class="text-2xl font-bold text-[#3344aa] mb-4 flex items-center"></h3>
            <div id="modal-content" class="text-gray-700 whitespace-pre-line leading-relaxed max-h-[70vh] overflow-y-auto"></div>
            <div class="mt-6 text-center"><button onclick="closeModal()" class="bg-[#3344aa] text-white px-6 py-2 rounded hover:bg-[#2a3a9a] transition-colors">닫기</button></div>
        </div>
    </div>

    <!-- 🔥 핵심: 공통 스크립트 호출 -->
    <script src="common.js"></script>

    <script>
        // ================= 메인 페이지 전용 상태 및 로직 =================
        const mainState = { currentSlide: 0, activeTab: 'notice', noticePage: 1 };
        const ITEMS_PER_PAGE = 5;

        document.addEventListener('DOMContentLoaded', () => {
            renderMain();
            setInterval(autoSlide, 5000);
        });

        function autoSlide() { mainState.currentSlide = (mainState.currentSlide + 1) % 3; updateHomeSlider(); }
        function setTab(t) { mainState.activeTab = t; mainState.noticePage = 1; renderMain(); lucide.createIcons(); }
        function changeNoticePage(d) { mainState.noticePage += d; renderMain(); lucide.createIcons(); }

        function renderMain() {
            // common.js에 있는 TEXT_CONTENT와 globalState를 활용합니다.
            const T = TEXT_CONTENT[globalState.language] || TEXT_CONTENT['KOR'];
            const root = document.getElementById('main-root');
            const list = T.notices[mainState.activeTab] || [];
            const start = (mainState.noticePage - 1) * ITEMS_PER_PAGE;
            const viewList = list.slice(start, start + ITEMS_PER_PAGE);
            const totalPages = Math.ceil(list.length / ITEMS_PER_PAGE);
            
            const noticesHTML = viewList.map(n => `
                <li onclick="navigateTo('공지사항상세.html?id=${n.id}')" class="flex justify-between cursor-pointer hover:bg-blue-50 p-2 rounded items-center border-b border-dashed border-gray-100 transition-colors">
                    <span class="truncate text-gray-700 w-3/4 flex items-center">
                        ${n.new ? '<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold mr-2">NEW</span>' : ''}
                        ${n.title}
                    </span>
                    <span class="text-xs text-gray-400 whitespace-nowrap">${n.date}</span>
                </li>
            `).join('');

            root.innerHTML = `
                <section class="relative h-[450px] bg-gray-200 cursor-pointer overflow-hidden" onclick="navigateTo('hbnu_about.html')">
                    <div id="slider-root" class="absolute inset-0"></div>
                    <div id="slider-dots" class="absolute bottom-10 left-0 right-0 flex justify-center space-x-2"></div>
                </section>
                <div class="bg-[#3344aa] text-white py-6 relative z-10 -mt-1 shadow-lg">
                    <div class="max-w-7xl mx-auto px-4 grid grid-cols-3 md:grid-cols-6 gap-4 text-center">
                        ${T.quickLinks.map(l => `<button onclick="navigateTo('${l.url}')" class="flex flex-col items-center group hover:text-[#99dd88] transition-colors"><div class="mb-2 p-2 rounded-full bg-white bg-opacity-10 group-hover:bg-opacity-20"><i data-lucide="${getIcon(l.type)}" width="24"></i></div><span class="text-sm font-medium">${l.text}</span></button>`).join('')}
                    </div>
                </div>
                <div class="max-w-7xl mx-auto px-4 py-16 grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div class="bg-white p-8 rounded-lg border shadow-sm h-full flex flex-col">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold text-[#3344aa] tracking-tighter">HBNU NOTICE</h3>
                            <div class="flex space-x-1">
                                ${['notice', 'academic', 'recruit'].map(tab => `<button onclick="setTab('${tab}')" class="px-3 py-1 text-xs rounded-full transition-colors ${mainState.activeTab===tab?'bg-[#3344aa] text-white':'bg-gray-100 text-gray-500 hover:bg-gray-200'}">${T.tabs[tab]}</button>`).join('')}
                            </div>
                        </div>
                        <ul class="space-y-3 flex-grow min-h-[220px]">
                            ${noticesHTML}
                        </ul>
                         <div class="flex justify-center items-center space-x-2 mt-4 text-sm text-gray-500">
                             ${totalPages > 0 ? `<button onclick="changeNoticePage(-1)" ${mainState.noticePage===1?'disabled':''} class="p-1 hover:bg-gray-100 disabled:opacity-30"><i data-lucide="chevron-left" width="16"></i></button><span>${mainState.noticePage} / ${totalPages}</span><button onclick="changeNoticePage(1)" ${mainState.noticePage===totalPages?'disabled':''} class="p-1 hover:bg-gray-100 disabled:opacity-30"><i data-lucide="chevron-right" width="16"></i></button>` : ''}
                         </div>
                    </div>
                    <div class="bg-white p-8 rounded-lg border shadow-sm h-full">
                         <div class="flex justify-between items-center mb-6"><h3 class="text-xl font-bold text-[#3344aa] tracking-tighter">HBNU NEWS</h3><button onclick="navigateTo('hbnu_news_list.html')" class="text-sm text-gray-500 hover:text-[#3344aa] font-bold">더보기 +</button></div>
                         ${T.news.map((n, i) => `
                             <div onclick="navigateTo('효빈뉴스상세.html?id=${n.id}')" class="cursor-pointer group ${i!==0?'mt-4 pt-4 border-t':''}">
                                ${i===0 && n.img ? `<div class="h-44 bg-gray-200 rounded-md mb-3 overflow-hidden shadow-inner"><img src="${n.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.style.display='none'"></div>` : ''}
                                <h4 class="font-bold text-gray-800 group-hover:text-[#3344aa] mb-1 transition-colors">${n.title}</h4>
                                <p class="text-xs text-gray-500">${n.date} · ${n.dept}</p>
                             </div>
                         `).join('')}
                    </div>
                </div>
            `;
            updateHomeSlider();
            lucide.createIcons();
        }

        function updateHomeSlider() {
            const root = document.getElementById('slider-root');
            if(!root) return;
            const T = TEXT_CONTENT[globalState.language] || TEXT_CONTENT['KOR'];
            const slides = [
                {t: T.slogan, s: "Since 1925", img: "슬라이드_배경1.png"},
                {t: T.slider2Title, s: T.slider2Desc, img: "슬라이드_배경2.png"},
                {t: T.slider3Title, s: T.slider3Desc, img: "슬라이드_배경3.png"}
            ];
            const s = slides[mainState.currentSlide];
            root.innerHTML = `<div class="absolute inset-0 bg-cover bg-center slide-fade opacity-100 animate-in fade-in" style="background-image:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)),url('${s.img}')"><div class="h-full max-w-7xl mx-auto px-4 flex flex-col justify-center text-white"><h2 class="text-xl md:text-2xl font-light text-[#99dd88] drop-shadow-md">${s.s}</h2><h1 class="text-4xl md:text-6xl font-black drop-shadow-lg leading-tight whitespace-pre-line tracking-tighter">${s.t}</h1></div></div>`;
            
            const dots = document.getElementById('slider-dots');
            if(dots) {
                dots.innerHTML = slides.map((_, i) => `<button onclick="event.stopPropagation(); mainState.currentSlide=${i}; updateHomeSlider();" class="w-3 h-3 rounded-full transition-all duration-500 ${mainState.currentSlide === i ? 'bg-[#99dd88] w-8' : 'bg-white bg-opacity-50'}"></button>`).join('');
            }
        }
    </script>
</body>
</html>
