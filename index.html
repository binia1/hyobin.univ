<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효빈대학교 - HBNU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .slide-fade { transition: opacity 1s ease-in-out; }
        .fade-in-up { animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #3344aa; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a3a9a; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- 헤더 영역 -->
    <div id="header-area"></div>

    <!-- 메인 컨텐츠 영역 -->
    <main id="main-root" class="flex-grow fade-in-up"></main>

    <!-- 푸터 영역 -->
    <footer id="footer-area" class="bg-[#2a2a2a] text-gray-400 py-12 text-sm mt-auto"></footer>

    <!-- 모달 (대학이념 등 팝업용) -->
    <div id="modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-50 p-4 hidden" onclick="closeModal()">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-black"><i data-lucide="x" width="24"></i></button>
            <h3 id="modal-title" class="text-2xl font-bold text-[#3344aa] mb-4 flex items-center"></h3>
            <div id="modal-content" class="text-gray-700 whitespace-pre-line leading-relaxed max-h-[70vh] overflow-y-auto"></div>
            <div class="mt-6 text-center"><button onclick="closeModal()" class="bg-[#3344aa] text-white px-6 py-2 rounded hover:bg-[#2a3a9a] transition-colors">닫기</button></div>
        </div>
    </div>

    <script>
        // ================= 효빈님을 위한 통합 마스터 데이터 설정 =================
        const TEXT_CONTENT = {
            KOR: {
                universityName: "효빈대학교",
                universitySub: "Hyobin National University",
                slogan: "불굴(不屈)의 역사, 혁신(革新)으로 미래를 열다",
                slider2Title: "Global Campus", slider2Desc: "세계를 향한 큰 울림, 효빈에서 시작됩니다",
                slider3Title: "Innovative Research", slider3Desc: "개천(改天)의 의지로 세상을 변화시키는 연구",
                menu: [
                    { title: "대학소개", url: "hbnu_about.html", sub: ["총장인사말", "대학이념", "대학연혁", "캠퍼스안내", "오시는길"] },
                    { title: "입학안내", url: "hbnu_admissions.html", sub: ["수시모집", "정시모집", "편입학", "대학원입학", "외국인전형"] },
                    { title: "교육·연구", url: "hbnu_academics.html", sub: ["대학(단과대)", "대학원", "학사일정", "중앙도서관", "연구소"] },
                    { title: "대학생활", url: "hbnu_life.html", sub: ["장학제도", "학생복지", "동아리", "효빈뉴스", "병무안내"] },
                    { title: "효빈광장", url: "hbnu_community.html", sub: ["공지사항", "자유게시판", "벼룩시장", "분실물센터", "정보공개"] },
                ],
                utility: { staff: "교직원", student: "학생", alumni: "동문", fund: "발전기금", portal: "HBNU 포털", mail: "웹메일", admission: "입학처" },
                quickLinks: [
                    { text: "종합정보시스템", url: "hbnu_portal.html", type: "PORTAL" }, { text: "중앙도서관", url: "hbnu_library.html", type: "LIBRARY" },
                    { text: "학사일정", url: "hbnu_calendar.html", type: "CALENDAR" }, { text: "셔틀/교통안내", url: "hbnu_traffic.html", type: "BUS" },
                    { text: "생활관", url: "hbnu_dorm.html", type: "DORM" }, { text: "전화번호안내", url: "hbnu_directory.html", type: "PHONE" }
                ],
                tabs: { notice: "일반공지", academic: "학사공지", recruit: "채용공지" },
                footer: { addresses: { main: "효빈광역시 서구 대학로 1 (당선동 1-1)" }, rights: "COPYRIGHT © 2025 HYOBIN NATIONAL UNIVERSITY. ALL RIGHTS RESERVED." },
                notices: {
                    notice: [
                        { id: 1001, title: "[교통] 효빈 트램(7호선) 효빈대입구역 운행 시간표", date: "2025.02.15", new: true },
                        { id: 1002, title: "[행사] 개교 100주년 기념 '효빈 타임캡슐' 봉인식", date: "2025.02.14", new: true },
                        { id: 1003, title: "[생활관] 2025-1학기 입사 대상자 발표", date: "2025.02.13", new: false },
                        { id: 1004, title: "[일반] 학생증 발급 안내", date: "2025.02.12", new: false },
                        { id: 1005, title: "[도서관] 열람실 24시간 개방", date: "2025.02.10", new: false }
                    ],
                    academic: [
                        { id: 2001, title: "[수강] 2025-1학기 수강신청 정정 및 취소", date: "2025.02.20", new: true },
                        { id: 2002, title: "[학사] 복학 신청 안내 (군전역자 포함)", date: "2025.02.18", new: true }
                    ],
                    recruit: [
                        { id: 3001, title: "[교원] 2025학년도 전임교원 초빙 공고", date: "2025.02.20", new: true }
                    ]
                },
                news: [
                    { id: 1, title: "박효빈 시장, 모교 방문해 '지방대학의 혁신' 특강", date: "2025.02.05", dept: "대외협력팀", img: "https://images.unsplash.com/photo-1544531586-fde5298cdd40?w=600" },
                    { id: 2, title: "[학술] 도시공학과 연구팀, 우수 논문상 수상", date: "2025.02.04", dept: "산학협력단", img: "https://images.unsplash.com/photo-1560264280-88b68371db39?w=600" }
                ]
            }
        };

        const state = { language: 'KOR', scrolled: false, isMenuOpen: false, currentSlide: 0, activeTab: 'notice', noticePage: 1 };
        const ITEMS_PER_PAGE = 5;

        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
            window.addEventListener('scroll', handleScroll);
            setInterval(autoSlide, 5000);
        });

        function handleScroll() {
            const isScrolled = window.scrollY > 50;
            if (state.scrolled !== isScrolled) { state.scrolled = isScrolled; renderHeader(); }
        }
        function autoSlide() { state.currentSlide = (state.currentSlide + 1) % 3; updateHomeSlider(); }

        function renderAll() { renderHeader(); renderMain(); renderFooter(); lucide.createIcons(); }

        function renderHeader() {
            const T = TEXT_CONTENT[state.language];
            const root = document.getElementById('header-area');
            root.innerHTML = `
                <div class="bg-gray-100 border-b text-xs py-2 px-4 hidden md:block">
                    <div class="max-w-7xl mx-auto flex justify-between items-center text-gray-600">
                        <div class="flex space-x-4">
                            <button class="hover:text-[#3344aa]">${T.utility.staff}</button>
                            <button class="hover:text-[#3344aa]">${T.utility.student}</button>
                            <button onclick="location.href='hbnu_alumni.html'" class="hover:text-[#3344aa]">${T.utility.alumni}</button>
                            <button onclick="location.href='hbnu_fund.html'" class="hover:text-[#3344aa] font-bold">${T.utility.fund}</button>
                        </div>
                        <div class="flex space-x-4 items-center">
                            <button onclick="location.href='hbnu_portal.html'" class="hover:text-[#3344aa] font-black text-[#3344aa] border border-[#3344aa] px-2 py-0.5 rounded">${T.utility.portal}</button>
                            <span class="text-gray-300">|</span>
                            <button onclick="location.href='hbnu_webmail.html'" class="hover:text-[#3344aa]">${T.utility.mail}</button>
                            <span class="text-gray-300">|</span>
                            <button onclick="location.href='hbnu_admissions.html'" class="hover:text-[#3344aa] font-bold">${T.utility.admission}</button>
                            <div class="flex items-center ml-2 space-x-2 bg-white px-2 py-0.5 rounded border border-gray-200">
                                <i data-lucide="globe" width="14" class="text-[#3344aa]"></i>
                                <select onchange="changeLang(this.value)" class="bg-transparent text-xs font-bold text-gray-700 outline-none cursor-pointer">
                                    <option value="KOR" ${state.language==='KOR'?'selected':''}>KOR</option>
                                    <option value="ENG" ${state.language==='ENG'?'selected':''}>ENG</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <header class="sticky top-0 z-50 transition-all duration-300 bg-white ${state.scrolled ? 'shadow-md py-2' : 'py-4 border-b'}">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between items-center h-16">
                            <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="location.href='hbnu_main.html'">
                                <img src="https://imgur.com/Uvf0SqH.png" onerror="this.src='https://via.placeholder.com/32?text=H'" class="w-10 h-10 mr-3 rounded-md">
                                <div class="flex flex-col">
                                    <span class="font-bold text-2xl tracking-tight leading-none text-[#3344aa]">${T.universityName}</span>
                                    <span class="text-[10px] text-gray-500 tracking-widest uppercase font-bold">${T.universitySub}</span>
                                </div>
                            </div>
                            <nav class="hidden lg:flex space-x-8">
                                ${T.menu.map((item, idx) => `
                                    <div class="group relative">
                                        <button onclick="location.href='${item.url || '#'}'" class="text-gray-800 font-bold hover:text-[#3344aa] py-2 text-lg transition-colors">${item.title}</button>
                                        <div class="absolute left-1/2 transform -translate-x-1/2 mt-2 w-48 bg-white shadow-lg rounded-md overflow-hidden hidden group-hover:block border-t-2 border-[#3344aa] z-50">
                                            <div class="py-2">
                                                ${item.sub.map((sub, subIdx) => `<button onclick="handleSubMenu(${idx}, ${subIdx})" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#3344aa] transition-colors">${sub}</button>`).join('')}
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </nav>
                            <div class="flex lg:hidden"><button onclick="toggleMenu()" class="text-gray-800 p-2"><i data-lucide="${state.isMenuOpen ? 'x' : 'menu'}" width="28"></i></button></div>
                        </div>
                    </div>
                    ${state.isMenuOpen ? `<div class="lg:hidden bg-white border-t absolute w-full shadow-xl z-50 h-screen overflow-y-auto pb-20"><div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">${T.menu.map((item, idx) => `<div class="border-b border-gray-100 pb-2"><button onclick="location.href='${item.url || '#'}'" class="block w-full text-left px-3 py-2 text-base font-bold text-[#3344aa]">${item.title}</button><div class="pl-6 space-y-1">${item.sub.map((sub, subIdx) => `<button onclick="handleSubMenu(${idx}, ${subIdx})" class="block w-full text-left px-3 py-2 text-sm text-gray-600 hover:text-[#3344aa]">${sub}</button>`).join('')}</div></div>`).join('')}</div></div>` : ''}
                </header>
            `;
        }

        function renderMain() {
            const T = TEXT_CONTENT[state.language];
            const root = document.getElementById('main-root');
            const list = T.notices[state.activeTab] || [];
            const start = (state.noticePage - 1) * ITEMS_PER_PAGE;
            const viewList = list.slice(start, start + ITEMS_PER_PAGE);
            const totalPages = Math.ceil(list.length / ITEMS_PER_PAGE);
            
            const noticesHTML = viewList.map(n => `
                <li onclick="location.href='hbnu_notice_view.html?id=${n.id}'" class="flex justify-between cursor-pointer hover:bg-blue-50 p-2 rounded items-center border-b border-dashed border-gray-100 transition-colors">
                    <span class="truncate text-gray-700 w-3/4 flex items-center">
                        ${n.new ? '<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold mr-2">NEW</span>' : ''}
                        ${n.title}
                    </span>
                    <span class="text-xs text-gray-400 whitespace-nowrap">${n.date}</span>
                </li>
            `).join('');

            root.innerHTML = `
                <section class="relative h-[450px] bg-gray-200 cursor-pointer overflow-hidden" onclick="location.href='hbnu_about.html'">
                    <div id="slider-root" class="absolute inset-0"></div>
                    <div id="slider-dots" class="absolute bottom-10 left-0 right-0 flex justify-center space-x-2"></div>
                </section>
                <div class="bg-[#3344aa] text-white py-6 relative z-10 -mt-1 shadow-lg">
                    <div class="max-w-7xl mx-auto px-4 grid grid-cols-3 md:grid-cols-6 gap-4 text-center">
                        ${T.quickLinks.map(l => `<button onclick="location.href='${l.url}'" class="flex flex-col items-center group hover:text-[#99dd88] transition-colors"><div class="mb-2 p-2 rounded-full bg-white bg-opacity-10 group-hover:bg-opacity-20"><i data-lucide="${getIcon(l.type)}" width="24"></i></div><span class="text-sm font-medium">${l.text}</span></button>`).join('')}
                    </div>
                </div>
                <div class="max-w-7xl mx-auto px-4 py-16 grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div class="bg-white p-8 rounded-lg border shadow-sm h-full flex flex-col">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold text-[#3344aa] tracking-tighter">HBNU NOTICE</h3>
                            <div class="flex space-x-1">
                                ${['notice', 'academic', 'recruit'].map(tab => `<button onclick="setTab('${tab}')" class="px-3 py-1 text-xs rounded-full transition-colors ${state.activeTab===tab?'bg-[#3344aa] text-white':'bg-gray-100 text-gray-500 hover:bg-gray-200'}">${T.tabs[tab]}</button>`).join('')}
                            </div>
                        </div>
                        <ul class="space-y-3 flex-grow min-h-[220px]">
                            ${noticesHTML}
                        </ul>
                         <div class="flex justify-center items-center space-x-2 mt-4 text-sm text-gray-500">
                             ${totalPages > 0 ? `<button onclick="changeNoticePage(-1)" ${state.noticePage===1?'disabled':''} class="p-1 hover:bg-gray-100 disabled:opacity-30"><i data-lucide="chevron-left" width="16"></i></button><span>${state.noticePage} / ${totalPages}</span><button onclick="changeNoticePage(1)" ${state.noticePage===totalPages?'disabled':''} class="p-1 hover:bg-gray-100 disabled:opacity-30"><i data-lucide="chevron-right" width="16"></i></button>` : ''}
                         </div>
                    </div>
                    <div class="bg-white p-8 rounded-lg border shadow-sm h-full">
                         <div class="flex justify-between items-center mb-6"><h3 class="text-xl font-bold text-[#3344aa] tracking-tighter">HBNU NEWS</h3><button onclick="location.href='hbnu_news_list.html'" class="text-sm text-gray-500 hover:text-[#3344aa] font-bold">더보기 +</button></div>
                         ${T.news.map((n, i) => `
                             <div onclick="location.href='hbnu_news_view.html?id=${n.id}'" class="cursor-pointer group ${i!==0?'mt-4 pt-4 border-t':''}">
                                ${i===0 && n.img ? `<div class="h-44 bg-gray-200 rounded-md mb-3 overflow-hidden shadow-inner"><img src="${n.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.style.display='none'"></div>` : ''}
                                <h4 class="font-bold text-gray-800 group-hover:text-[#3344aa] mb-1 transition-colors">${n.title}</h4>
                                <p class="text-xs text-gray-500">${n.date} · ${n.dept}</p>
                             </div>
                         `).join('')}
                    </div>
                </div>
            `;
            updateHomeSlider();
        }

        function renderFooter() { 
            const T = TEXT_CONTENT[state.language];
            document.getElementById('footer-area').innerHTML = `
                <div class="max-w-7xl mx-auto px-4">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8 border-b border-gray-700 pb-8">
                        <div class="col-span-1">
                            <div class="text-white font-bold text-xl mb-4 flex items-center cursor-pointer" onclick="location.href='hbnu_main.html'">
                                <img src="https://imgur.com/Uvf0SqH.png" class="w-8 h-8 mr-2 bg-white rounded-md p-0.5" />
                                ${T.universityName}
                            </div>
                            <p class="text-gray-500 text-xs leading-relaxed">
                                1925-2025 (100th Anniversary)<br>
                                ${T.slogan}
                            </p>
                        </div>
                        <div class="col-span-3 grid grid-cols-1 sm:grid-cols-3 gap-8">
                            <div>
                                <h4 class="text-white font-bold mb-4 text-sm">캠퍼스 안내</h4>
                                <ul class="text-xs text-gray-400 space-y-2">
                                    <li><b>본(당선)캠퍼스:</b> ${T.footer.addresses.main}</li>
                                    <li><button onclick="location.href='hbnu_location.html'" class="text-[#99dd88] hover:underline flex items-center"><i data-lucide="map-pin" class="w-3 h-3 mr-1"></i> 오시는 길 상세보기</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 class="text-white font-bold mb-4 text-sm">정보 보러가기</h4>
                                <ul class="text-xs text-gray-400 space-y-2">
                                    <li><button onclick="location.href='hbnu_privacy.html'" class="hover:text-white">개인정보처리방침</button></li>
                                    <li><button onclick="location.href='hbnu_email_refusal.html'" class="hover:text-white">이메일무단수집거부</button></li>
                                    <li><button onclick="location.href='hbnu_info_disclosure.html'" class="hover:text-white">대학정보공개</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 class="text-white font-bold mb-4 text-sm">빠른 메뉴</h4>
                                <ul class="text-xs text-gray-400 space-y-2">
                                    <li><button onclick="location.href='hbnu_sitemap.html'" class="hover:text-white">사이트맵</button></li>
                                    <li><button onclick="location.href='hbnu_calendar.html'" class="hover:text-white">학사일정</button></li>
                                    <li><button onclick="location.href='hbnu_directory.html'" class="hover:text-white">전화번호안내</button></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="text-center text-gray-500 text-[10px] tracking-widest">${T.footer.rights}</div>
                </div>
            `; 
        }

        function changeLang(l) { state.language = l; renderAll(); }
        function toggleMenu() { state.isMenuOpen = !state.isMenuOpen; renderHeader(); lucide.createIcons(); }
        function setTab(t) { state.activeTab = t; state.noticePage = 1; renderMain(); lucide.createIcons(); }
        function changeNoticePage(d) { state.noticePage += d; renderMain(); lucide.createIcons(); }
        
        // ================= 효빈님 요청: 모든 세부 메뉴 파일 정확하게 연결 =================
        function handleSubMenu(catIdx, subIdx) {
            const routes = [
                // 0: 대학소개
                ['hbnu_about.html#president', 'hbnu_about.html#identity', 'hbnu_history.html', 'hbnu_campus.html', 'hbnu_location.html'],
                
                // 1: 입학안내
                ['hbnu_admission_guide.html?type=susi', 'hbnu_admission_guide.html?type=jungsi', 'hbnu_transfer.html', 'hbnu_grad.html', 'hbnu_global.html'],
                
                // 2: 교육·연구
                ['hbnu_colleges.html', 'hbnu_grad.html', 'hbnu_calendar.html', 'hbnu_library.html', 'hbnu_research.html'],
                
                // 3: 대학생활
                ['hbnu_scholarship.html', 'hbnu_welfare.html', 'hbnu_clubs.html', 'hbnu_news_list.html', 'hbnu_military.html'],
                
                // 4: 효빈광장
                ['hbnu_community.html', 'hbnu_board_free.html', 'hbnu_market.html', 'hbnu_market.html?tab=lost', 'hbnu_info_disclosure.html']
            ];
            
            if (routes[catIdx] && routes[catIdx][subIdx]) {
                location.href = routes[catIdx][subIdx];
            }
        }

        function updateHomeSlider() {
            const root = document.getElementById('slider-root');
            if(!root) return;
            const T = TEXT_CONTENT[state.language];
            const slides = [
                {t: T.slogan, s: "Since 1925", img: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=1950"},
                {t: T.slider2Title, s: T.slider2Desc, img: "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1950"},
                {t: T.slider3Title, s: T.slider3Desc, img: "https://images.unsplash.com/photo-1621640786029-22ad19c1585c?w=1950"}
            ];
            const s = slides[state.currentSlide];
            root.innerHTML = `<div class="absolute inset-0 bg-cover bg-center slide-fade opacity-100 animate-in fade-in" style="background-image:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)),url('${s.img}')"><div class="h-full max-w-7xl mx-auto px-4 flex flex-col justify-center text-white"><h2 class="text-xl md:text-2xl font-light text-[#99dd88] drop-shadow-md">${s.s}</h2><h1 class="text-4xl md:text-6xl font-black drop-shadow-lg leading-tight whitespace-pre-line tracking-tighter">${s.t}</h1></div></div>`;
            
            const dots = document.getElementById('slider-dots');
            if(dots) {
                dots.innerHTML = slides.map((_, i) => `<button onclick="event.stopPropagation(); state.currentSlide=${i}; updateHomeSlider();" class="w-3 h-3 rounded-full transition-all duration-500 ${state.currentSlide === i ? 'bg-[#99dd88] w-8' : 'bg-white bg-opacity-50'}"></button>`).join('');
            }
        }

        function getIcon(type) {
            const icons = { 'PORTAL': 'monitor', 'LIBRARY': 'book-open', 'CALENDAR': 'calendar', 'BUS': 'bus', 'DORM': 'building-2', 'PHONE': 'phone' };
            return icons[type] || 'monitor';
        }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
    </script>
</body>
</html>
