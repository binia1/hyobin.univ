        function tickRailSimulator() {
            if (!simState.running || simState.codeRedActive) return;

            simState.trains.forEach(t => {
                const stations = t.line === 'A' ? RAIL_SIM_DATA.lineA : RAIL_SIM_DATA.lineB;
                if (t.line === 'A') {
                    // 왕복 운행
                    t.idx += t.dir;
                    if (t.idx >= stations.length - 1) { t.idx = stations.length - 1; t.dir = -1; }
                    if (t.idx <= 0) { t.idx = 0; t.dir = 1; }
                } else {
                    // B선 순환 운행
                    t.idx = (t.idx + 1) % stations.length;
                }
            });

            if (mainState.mode === 'simulator') {
                updateSimulatorDOM();
            }
        }

        // 특수 작전 1: 정문 아치 '백년호 클래식 트램 × B선 모노레일 골든 크로스' 강제 발령

            simState.goldenCrossActive = true;
            simState.codeRedActive = false;
            simState.signalAspect = "GREEN";

        // 특수 작전 2: 화공 전기대역(A05) 초보 실습생 ATS 미취급 비상제동 & 철도운영과 강의실 3현시 신호기 적색 연동

                            </div>
                        </div>

                        <!-- 하단: CTC 실시간 관제 로그 콘솔 -->
                        <div class="mt-6 bg-black rounded-xl p-4 border border-slate-800 font-mono-tech text-xs">
                            <div class="text-gray-400 mb-2 font-bold flex justify-between">
                                <span>📡 HBNU-CTC 실시간 관제 및 7대 레전드 이벤트 로그</span>
                                <span class="text-[#74f466]">철도운영시스템공학과 전용 강의실 디오라마 광케이블 동기화율 100%</span>
                            </div>
                            <div id="sim-log-box" class="space-y-1 max-h-28 overflow-y-auto text-gray-200">
                                ${simState.ctcLogs.map(log => `<div class="truncate hover:text-white">${log}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateSimulatorDOM() {
            // 전체 리렌더링 없이 열차 마커 좌표와 편성 현황만 부드럽게 갱신
            simState.trains.forEach(t => {
                const el = document.getElementById('train-marker-' + t.id);
                const stations = t.line === 'A' ? RAIL_SIM_DATA.lineA : RAIL_SIM_DATA.lineB;
                const curSt = stations[t.idx] || stations[0];
                if (el) {
                    el.style.left = curSt.x + '%';
                    el.style.top = (curSt.y - 6) + '%';
                }
            });
            const listEl = document.getElementById('sim-train-list');
            if (listEl) {
                listEl.innerHTML = simState.trains.map(t => {
                    const stList = t.line === 'A' ? RAIL_SIM_DATA.lineA : RAIL_SIM_DATA.lineB;
                    const cur = stList[t.idx] || stList[0];
                    return `
                        <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                            <div>
                                <div class="font-bold text-white flex items-center gap-1.5">
                                    <span class="w-2.5 h-2.5 rounded-full" style="background-color:${t.color}"></span>
                                    <span>${t.name}</span>
                                </div>
                                <div class="text-[11px] text-gray-400 mt-0.5">기관사: ${t.driver}</div>
                            </div>
                            <div class="text-right">
                                <div class="font-mono-tech font-bold text-[#a0fff9]">${cur.code} ${cur.name}</div>
                                <div class="text-[10px] ${t.status.includes('비상') || t.status.includes('봉쇄') ? 'text-red-400 font-bold' : 'text-emerald-400'}">${t.status}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        // ================= 5. 전체 공문서 24건 아카이브 뷰 & 단과대/건물 총람 뷰 =================
        function renderAllNoticesView(root) {
            const all = [
                ...HBNU_PORTAL_DATA.notices.notice,
                ...HBNU_PORTAL_DATA.notices.academic,
                ...HBNU_PORTAL_DATA.notices.recruit,
                ...HBNU_PORTAL_DATA.notices.rail
            ];
            root.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-10">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b-2 border-[#3344aa]">
                        <div>
                            <h1 class="text-2xl font-black text-[#1e2a78]">효빈대학교 공식 공문서 아카이브 (전체 ${all.length}건)</h1>
                            <p class="text-xs text-gray-500 mt-1">각 항목을 클릭하면 결재 직인과 첨부파일이 포함된 공문서 전문이 열립니다.</p>
                        </div>
                        <button onclick="switchMode('portal')" class="bg-[#3344aa] text-white px-4 py-2 rounded-xl text-xs font-bold self-start">← 메인 대문으로 돌아가기</button>
                    </div>
                    <div class="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-200 shadow-sm">
                        ${all.map(n => `
                            <div onclick="openPortalNotice(${n.id})" class="p-4 md:p-5 hover:bg-blue-50/70 cursor-pointer flex flex-col md:flex-row md:items-center justify-between gap-2 transition-colors">
                                <div class="space-y-1 max-w-3xl">
                                    <div class="flex items-center gap-2">
                                        <span class="bg-[#3344aa] text-white text-[11px] font-bold px-2 py-0.5 rounded">${n.cat}</span>
                                        <span class="text-xs font-mono text-gray-500">${n.docNo}</span>
                                        ${n.new ? '<span class="bg-red-100 text-red-600 text-[10px] font-extrabold px-1.5 py-0.5 rounded">NEW</span>' : ''}
                                    </div>
                                    <h3 class="font-bold text-gray-900 text-sm md:text-base">${n.title}</h3>
                                </div>
                                <div class="text-xs text-gray-500 md:text-right shrink-0">
                                    <div class="font-bold text-gray-700">${n.dept}</div>
                                    <div>${n.date} · 조회 ${n.views.toLocaleString()}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCollegesDirectoryView(root) {
            const collegeGroups = MEGA_MENU.find(m => m.title === "대학/대학원")?.groups || [];
            root.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-10 space-y-8">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b-2 border-[#3344aa]">
                        <div>
                            <h1 class="text-2xl font-black text-[#1e2a78]">17개 단과대학 · 10개 대학원 · 5대 캠퍼스 동적 라우팅 총람</h1>
                            <p class="text-xs text-gray-500 mt-1">단과대학 클릭 시 <code>단과대.html?col=단과대명</code>으로 즉시 이동합니다.</p>
                        </div>
                        <button onclick="switchMode('portal')" class="bg-[#3344aa] text-white px-4 py-2 rounded-xl text-xs font-bold self-start">← 메인 대문으로 돌아가기</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${collegeGroups.map(g => `
                            <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
                                <h3 class="text-base font-black text-[#3344aa] border-b pb-2 mb-4">${g.name}</h3>
                                <div class="grid grid-cols-2 gap-2">
                                    ${g.items.map(col => `
                                        <button onclick="navigateTo('${getMenuUrl(col)}')" class="text-left px-3 py-2 rounded-lg bg-slate-50 hover:bg-[#3344aa] hover:text-white text-xs font-bold transition-colors flex items-center justify-between">
                                            <span>${col}</span>
                                            <span>➔</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ================= 6. 공문서 및 뉴스 상세 모달 오픈 함수 =================
        function openPortalNotice(id) {
            const all = [
                ...HBNU_PORTAL_DATA.notices.notice,
                ...HBNU_PORTAL_DATA.notices.academic,
                ...HBNU_PORTAL_DATA.notices.recruit,
                ...HBNU_PORTAL_DATA.notices.rail
            ];
            const item = all.find(n => n.id === id);
            if (!item) return;

            document.getElementById('modal-cat-badge').innerText = item.cat;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-meta').innerHTML = `
                <span><strong>문서번호:</strong> ${item.docNo}</span>
                <span><strong>담당부서:</strong> ${item.dept}</span>
                <span><strong>등록일:</strong> ${item.date} · <strong>조회:</strong> ${item.views.toLocaleString()}</span>
            `;
            document.getElementById('modal-content').innerHTML = `
                <div class="text-center border-b-2 border-gray-800 pb-3 mb-4">
                    <div class="text-xs text-gray-500 font-bold">어려움에 굴하지 않는 불굴의 효빈대</div>
                    <div class="text-lg font-black text-[#1e2a78]">국립 효빈대학교 공식 공문서</div>
                </div>
                <div class="leading-7 text-gray-800">${item.content}</div>
                <div class="mt-6 pt-4 border-t border-gray-200 text-center font-black text-base tracking-widest text-gray-900">
                    효 빈 대 학 교 총 장 <span class="inline-block border-2 border-red-600 text-red-600 text-[10px] px-1.5 py-0.5 rounded ml-1">관인생략</span>
                </div>
            `;
            document.getElementById('modal-files').innerHTML = `📎 첨부파일: <span class="underline cursor-pointer">${item.file}</span>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function openPortalNews(id) {
            const item = HBNU_PORTAL_DATA.news.find(n => n.id === id);
            if (!item) return;

            document.getElementById('modal-cat-badge').innerText = item.badge;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-meta').innerHTML = `
                <span><strong>소속:</strong> ${item.dept}</span>
                <span><strong>보도일:</strong> ${item.date}</span>
            `;
            document.getElementById('modal-content').innerHTML = `
                <div class="p-3.5 bg-blue-50 border-l-4 border-[#3344aa] font-bold text-xs md:text-sm text-[#1e2a78] rounded-r-lg mb-4">${item.summary}</div>
                <div class="leading-7 text-gray-800">${item.content}</div>
            `;
            document.getElementById('modal-files').innerHTML = `📰 효빈대학교 공식 보도자료 (홍보처)`;
            document.getElementById('modal-overlay').classList.remove('hidden');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
    </script>
</body>
</html>
