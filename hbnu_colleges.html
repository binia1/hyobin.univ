        // ================= 렌더링 로직 =================
        function renderColleges(data) {
            const container = document.getElementById('colleges-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-10">검색 결과가 없습니다.</div>';
                return;
            }

            data.forEach(group => {
                const section = document.createElement('div');
                section.className = 'fade-in';
                section.innerHTML = `
                    <div class="flex items-center mb-6">
                        <div class="p-3 rounded-full ${group.bg} mr-4">
                            <i data-lucide="${group.icon}" class="${group.color} w-6 h-6"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800">${group.field}</h2>
                        <div class="h-px bg-gray-200 flex-grow ml-6"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${group.colleges.map(col => `
                            <div class="bg-white border rounded-xl overflow-hidden hover:shadow-lg transition-all duration-300 group">
                                <div class="bg-gray-50 px-5 py-3 border-b font-bold text-gray-700 group-hover:text-[#3344aa] transition-colors flex justify-between items-center">
                                    ${col.name}
                                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity text-[#3344aa]"></i>
                                </div>
                                <div class="p-5">
                                    <ul class="space-y-2">
                                        ${col.depts.map(dept => `
                                            <li onclick="goToDept('${dept}')" class="text-sm text-gray-600 hover:text-[#3344aa] cursor-pointer flex items-center transition-colors">
                                                <span class="w-1.5 h-1.5 bg-gray-300 rounded-full mr-2 group-hover:bg-[#3344aa]"></span>
                                                ${dept}
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
            lucide.createIcons();
        }

        // ================= 학과 상세 페이지 이동 =================
        function goToDept(deptName) {
            // 특수문자(*, ⚭) 제거 후 URL 파라미터로 전달
            const cleanName = deptName.replace(/[*⚭]/g, '').trim();

            // [수정] 개별 파일 매핑
            const specialDepts = {
                "필리핀어학과": "hbnu_dept_filipino.html",
                "일어일문학과": "hbnu_dept_japanese.html",
                "철도운전학과": "hbnu_dept_railway.html",
                "사회복지경영학과": "hbnu_dept_sw_management.html",
                "사회복지정책학과": "hbnu_dept_sw_policy.html",
                "만화애니메이션학과": "hbnu_dept_animation.html"
            };

            if (specialDepts[cleanName]) {
                location.href = specialDepts[cleanName];
            } else {
                location.href = `hbnu_dept_detail.html?dept=${encodeURIComponent(cleanName)}`;
            }
        }

        // ================= 검색 필터 로직 =================
        function filterDepartments(keyword) {
            const term = keyword.trim().toLowerCase();
            
            if (!term) {
                renderColleges(COLLEGES_DB);
                return;
            }

            // 검색어가 포함된 단과대나 학과가 있는 그룹만 필터링
            const filtered = COLLEGES_DB.map(group => {
                const matchingColleges = group.colleges.filter(col => {
                    const matchCollegeName = col.name.toLowerCase().includes(term);
                    const matchDept = col.depts.some(d => d.toLowerCase().includes(term));
                    return matchCollegeName || matchDept;
                }).map(col => col); // 얕은 복사

                return { ...group, colleges: matchingColleges };
            }).filter(group => group.colleges.length > 0);

            renderColleges(filtered);
        }

        // 초기 렌더링
        document.addEventListener('DOMContentLoaded', () => {
            renderColleges(COLLEGES_DB);
        });
    </script>
