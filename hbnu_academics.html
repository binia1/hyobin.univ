<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교육·연구 - 효빈대학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <div id="header-area"></div>

    <main class="max-w-6xl mx-auto px-4 py-16 flex-grow w-full">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-12">교육 · 연구 (Academics)</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 단과대학 -->
            <a href="hbnu_colleges.html" class="group block bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-lg transition">
                <div class="h-40 bg-gray-200 relative flex items-center justify-center bg-[url('https://이미지.unsplash.com/photo-1523050854058-8df90110c9f1?w=800')] bg-cover bg-center">
                    <div class="absolute inset-0 bg-black bg-opacity-40 group-hover:bg-opacity-30 transition"></div>
                    <span class="text-white font-bold text-2xl z-10 relative">대학(단과대)</span>
                </div>
                <div class="p-5">
                    <p class="text-gray-600 text-sm mb-3">8개 계열 25개 단과대학 학과 정보</p>
                    <span class="text-[#3344aa] font-bold text-sm flex items-center">바로가기 <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i></span>
                </div>
            </a>

            <!-- 대학원 -->
            <a href="hbnu_grad.html" class="group block bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-lg transition">
                <div class="h-40 bg-gray-200 relative flex items-center justify-center bg-[url('https://이미지.unsplash.com/photo-1532012197267-da84d127e765?w=800')] bg-cover bg-center">
                    <div class="absolute inset-0 bg-black bg-opacity-40 group-hover:bg-opacity-30 transition"></div>
                    <span class="text-white font-bold text-2xl z-10 relative">대학원</span>
                </div>
                <div class="p-5">
                    <p class="text-gray-600 text-sm mb-3">일반/전문/특수대학원 석박사 과정</p>
                    <span class="text-[#3344aa] font-bold text-sm flex items-center">바로가기 <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i></span>
                </div>
            </a>

            <!-- [NEW] 교양대학 -->
            <a href="hbnu_liberal_arts.html" class="group block bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-lg transition">
                <div class="h-40 bg-gray-200 relative flex items-center justify-center bg-[url('https://이미지.unsplash.com/photo-1524178232363-1fb2b075b655?w=800')] bg-cover bg-center">
                    <div class="absolute inset-0 bg-black bg-opacity-40 group-hover:bg-opacity-30 transition"></div>
                    <span class="text-white font-bold text-2xl z-10 relative">교양대학</span>
                </div>
                <div class="p-5">
                    <p class="text-gray-600 text-sm mb-3">효빈 시그니처 교양 및 기초 교육과정</p>
                    <span class="text-[#3344aa] font-bold text-sm flex items-center">바로가기 <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i></span>
                </div>
            </a>

            <!-- 학사일정 -->
            <a href="hbnu_calendar.html" class="group block bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-lg transition">
                <div class="p-6 flex items-center">
                    <div class="bg-blue-100 p-3 rounded-full mr-4 text-[#3344aa]"><i data-lucide="calendar" class="w-6 h-6"></i></div>
                    <div>
                        <h3 class="font-bold text-gray-800">학사일정</h3>
                        <p class="text-xs text-gray-500 mt-1">2025학년도 주요 일정 안내</p>
                    </div>
                </div>
            </a>

            <!-- 중앙도서관 -->
            <a href="hbnu_library.html" class="group block bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-lg transition">
                <div class="p-6 flex items-center">
                    <div class="bg-green-100 p-3 rounded-full mr-4 text-green-600"><i data-lucide="book-open" class="w-6 h-6"></i></div>
                    <div>
                        <h3 class="font-bold text-gray-800">중앙도서관</h3>
                        <p class="text-xs text-gray-500 mt-1">학술 정보 및 열람실 이용</p>
                    </div>
                </div>
            </a>

            <!-- 연구소 -->
            <a href="hbnu_research.html" class="group block bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-lg transition">
                <div class="p-6 flex items-center">
                    <div class="bg-purple-100 p-3 rounded-full mr-4 text-purple-600"><i data-lucide="flask-conical" class="w-6 h-6"></i></div>
                    <div>
                        <h3 class="font-bold text-gray-800">부설연구소</h3>
                        <p class="text-xs text-gray-500 mt-1">연구원 및 센터 소개</p>
                    </div>
                </div>
            </a>
        </div>
    </main>

    <footer id="footer-area" class="bg-[#2a2a2a] text-gray-400 py-12 text-sm mt-auto"></footer>
    <script>lucide.createIcons();</script>
    <script src="common.js"></script>
</body>
</html>
