<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터넷 증명발급 - 효빈대학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    
    <div id="header-area"></div>

    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
            <i data-lucide="file-check" class="w-8 h-8 mr-3 text-[#3344aa]"></i> 증명서 발급 신청
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- 왼쪽: 신청 폼 -->
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="font-bold text-lg mb-4 border-b pb-2">발급 가능한 증명서</h3>
                    <div class="space-y-3">
                        <label class="flex items-center justify-between p-3 border rounded hover:bg-blue-50 cursor-pointer transition">
                            <div class="flex items-center">
                                <input type="checkbox" class="w-4 h-4 text-[#3344aa] mr-3">
                                <div>
                                    <span class="block font-bold text-gray-800">재학증명서 (국문)</span>
                                    <span class="text-xs text-gray-500">용도: 관공서 제출, 금융기관 등</span>
                                </div>
                            </div>
                            <span class="text-[#3344aa] font-bold">500원</span>
                        </label>
                        <label class="flex items-center justify-between p-3 border rounded hover:bg-blue-50 cursor-pointer transition">
                            <div class="flex items-center">
                                <input type="checkbox" class="w-4 h-4 text-[#3344aa] mr-3">
                                <div>
                                    <span class="block font-bold text-gray-800">성적증명서 (국문)</span>
                                    <span class="text-xs text-gray-500">용도: 취업, 진학, 장학금 신청</span>
                                </div>
                            </div>
                            <span class="text-[#3344aa] font-bold">1,000원</span>
                        </label>
                        <label class="flex items-center justify-between p-3 border rounded hover:bg-blue-50 cursor-pointer transition">
                            <div class="flex items-center">
                                <input type="checkbox" class="w-4 h-4 text-[#3344aa] mr-3">
                                <div>
                                    <span class="block font-bold text-gray-800">교육비납입증명서</span>
                                    <span class="text-xs text-gray-500">용도: 연말정산 등</span>
                                </div>
                            </div>
                            <span class="text-[#3344aa] font-bold">무료</span>
                        </label>
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 text-sm text-blue-900">
                    <p class="font-bold mb-1 flex items-center"><i data-lucide="info" class="w-4 h-4 mr-1"></i> 유의사항</p>
                    <ul class="list-disc pl-4 space-y-1">
                        <li>결제 후 <b>24시간 이내</b>에만 출력 가능합니다.</li>
                        <li>PDF 저장은 지원하지 않으며, 직접 연결된 프린터로만 출력됩니다. (위변조 방지)</li>
                    </ul>
                </div>
            </div>

            <!-- 오른쪽: 장바구니/결제 -->
            <div class="md:col-span-1">
                <div class="bg-white p-6 rounded-xl border shadow-sm sticky top-6">
                    <h3 class="font-bold text-lg mb-4">결제 정보</h3>
                    <div class="space-y-2 text-sm text-gray-600 mb-6 border-b pb-6">
                        <div class="flex justify-between">
                            <span>신청 부수</span>
                            <span>0건</span>
                        </div>
                        <div class="flex justify-between">
                            <span>수수료</span>
                            <span>0원</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mb-6">
                        <span class="font-bold text-gray-800">총 결제금액</span>
                        <span class="font-bold text-2xl text-[#3344aa]">0원</span>
                    </div>
                    <button class="w-full bg-[#3344aa] text-white py-3 rounded-lg font-bold hover:bg-[#2a3a9a] transition shadow-md" onclick="alert('결제 모듈이 실행됩니다.')">
                        결제 및 발급하기
                    </button>
                    <button class="w-full mt-2 border border-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-50 transition" onclick="alert('미리보기 팝업')">
                        증명서 미리보기
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer-area" class="bg-[#2a2a2a] text-gray-400 py-12 text-sm mt-auto"></footer>
    <script>lucide.createIcons();</script>
    <script src="common.js"></script>
</body>
</html>
