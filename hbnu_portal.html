<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBNU Portal - 효빈대학교 종합정보시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .login-card { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border-top-color: #3344aa; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen text-slate-800">
    
    <!-- 헤더 -->
    <header class="bg-white border-b h-16 flex items-center px-6 justify-between shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="hbnu_main.html" class="font-black text-[#3344aa] text-xl flex items-center hover:opacity-80 transition">
                <img src="https://imgur.com/Uvf0SqH.png" 
                     onerror="this.src='https://via.placeholder.com/32?text=H'" 
                     alt="HBNU 로고" 
                     class="w-8 h-8 mr-2 rounded-md object-contain shadow-sm">
                <span id="portal-title" class="text-lg tracking-tighter">효빈대학교 포털</span>
            </a>
            <div class="h-4 w-px bg-slate-200 hidden sm:block"></div>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest hidden sm:block">Integrated Information System</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-slate-100 px-2 py-1 rounded-md">
                <span class="text-[10px] font-black text-slate-500" id="current-lang-display">KOR</span>
            </div>
        </div>
    </header>

    <!-- 로그인 메인 섹션 -->
    <main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-50 rounded-full blur-3xl opacity-50"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-indigo-50 rounded-full blur-3xl opacity-50"></div>

        <div class="login-card bg-white p-10 rounded-[32px] shadow-2xl shadow-blue-100 max-w-md w-full border border-slate-100 relative z-10">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-sm border border-slate-50">
                    <img src="https://imgur.com/Uvf0SqH.png" 
                         onerror="this.src='https://via.placeholder.com/64?text=H'" 
                         alt="HBNU 로고" 
                         class="w-16 h-16 object-contain">
                </div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight" id="login-title">통합 로그인</h1>
                <p class="text-slate-400 text-xs mt-2 font-medium">HBNU 클라우드 통합 계정으로 로그인해 주세요.</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">ID / Student No.</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-4 top-3.5 text-slate-300 w-4 h-4"></i>
                        <input type="text" id="inp-id" placeholder="학번(202501234)" required
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border-2 border-slate-50 rounded-2xl focus:border-[#3344aa] focus:bg-white outline-none transition-all font-bold text-sm">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">Password</label>
                    <div class="relative">
                        <i data-lucide="key-round" class="absolute left-4 top-3.5 text-slate-300 w-4 h-4"></i>
                        <input type="password" id="inp-pw" placeholder="비밀번호" required
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border-2 border-slate-50 rounded-2xl focus:border-[#3344aa] focus:bg-white outline-none transition-all font-bold text-sm">
                    </div>
                </div>

                <div class="flex items-center justify-between px-1 py-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-[#3344aa] focus:ring-[#3344aa]">
                        <span class="text-xs font-bold text-slate-500 group-hover:text-slate-800 transition">ID 저장</span>
                    </label>
                    <a href="#" class="text-xs font-bold text-[#3344aa] hover:underline">비밀번호 찾기</a>
                </div>

                <button type="submit" id="btn-login" class="w-full bg-[#3344aa] text-white py-4 rounded-2xl font-black text-sm hover:bg-[#2a3a9a] transition shadow-xl shadow-blue-100 active:scale-[0.98] flex justify-center items-center">
                    <span>로그인</span>
                    <div id="login-spinner" class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-4 w-4 ml-3 hidden"></div>
                </button>
            </form>

            <div id="error-message" class="mt-4 p-3 bg-red-50 text-red-600 text-[10px] rounded-xl border border-red-100 hidden text-center font-bold"></div>

            <div class="mt-8 pt-8 border-t border-slate-50 text-center">
                <p class="text-[11px] text-slate-400 font-medium">신입생은 최초 로그인 시 학번 확인이 필요합니다.</p>
                <div class="flex justify-center gap-4 mt-4">
                    <button class="text-[10px] font-black text-[#3344aa] bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition">학번조회</button>
                    <button class="text-[10px] font-black text-slate-400 bg-slate-50 px-3 py-1.5 rounded-lg hover:bg-slate-100 transition">이용안내</button>
                </div>
            </div>
        </div>
    </main>

    <footer id="portal-footer" class="text-center py-8 text-[10px] text-slate-300 font-bold uppercase tracking-widest">
        COPYRIGHT © 2025 HYOBIN NATIONAL UNIVERSITY. ALL RIGHTS RESERVED.
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정 로드
        let firebaseConfig;
        try {
            firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        } catch (e) {
            firebaseConfig = {};
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hbnu-portal';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // 필수 설정 체크 (로컬 실행 시 더미 키 사용 지양)
        if (!firebaseConfig.apiKey) {
            console.error("Firebase config is missing. Please check the environment settings.");
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const TEXT_CONTENT = {
            KOR: { error_fill: "모든 항목을 입력해 주세요.", error_auth: "인증에 실패했습니다.", loading: "처리 중..." },
            ENG: { error_fill: "Please fill in all fields.", error_auth: "Authentication failed.", loading: "Processing..." }
        };

        const currLang = localStorage.getItem('hbnu_lang') || 'KOR';
        const T = TEXT_CONTENT[currLang] || TEXT_CONTENT['KOR'];

        window.onload = () => {
            lucide.createIcons();
        };

        window.handleLogin = async (event) => {
            event.preventDefault();
            const btnLogin = document.getElementById('btn-login');
            const spinner = document.getElementById('login-spinner');
            const errorBox = document.getElementById('error-message');
            const id = document.getElementById('inp-id').value.trim();
            const pw = document.getElementById('inp-pw').value.trim();

            if (!id || !pw) {
                showError(T.error_fill);
                return;
            }

            errorBox.classList.add('hidden');
            btnLogin.disabled = true;
            spinner.classList.remove('hidden');
            const originalBtnText = btnLogin.querySelector('span').innerText;
            btnLogin.querySelector('span').innerText = T.loading;

            try {
                // RULE 3 준수: 인증을 먼저 수행
                let userCredential;
                if (initialToken) {
                    userCredential = await signInWithCustomToken(auth, initialToken);
                } else {
                    userCredential = await signInAnonymously(auth);
                }

                const user = userCredential.user;
                if (!user) throw new Error("USER_UNDEFINED");

                // RULE 1 준수: /artifacts/{appId}/users/{userId}/{collectionName}/{documentId}
                // 'profiles' 컬렉션 내에 'user_data' 문서로 저장
                const userProfileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profiles', 'user_data');
                
                await setDoc(userProfileRef, {
                    studentId: id,
                    name: id === '202501234' ? '박효빈' : 'HBNU 학생',
                    department: id === '202501234' ? '사회복지정책학과' : '일반학과',
                    lastLogin: new Date().toISOString(),
                    authType: initialToken ? 'TOKEN' : 'ANONYMOUS'
                }, { merge: true });

                sessionStorage.setItem('hbnu_session', 'active');
                sessionStorage.setItem('hbnu_uid', user.uid);
                sessionStorage.setItem('hbnu_id', id);

                // 대시보드로 이동
                setTimeout(() => {
                    location.href = "hbnu_portal_dashboard.html";
                }, 500);

            } catch (error) {
                console.error("Firebase Login Error:", error);
                let detailMsg = error.code || error.message;
                showError(`${T.error_auth} [${detailMsg}]`);
                btnLogin.disabled = false;
                spinner.classList.add('hidden');
                btnLogin.querySelector('span').innerText = originalBtnText;
            }
        };

        function showError(msg) {
            const errorBox = document.getElementById('error-message');
            errorBox.innerText = msg;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
