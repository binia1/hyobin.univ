<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBNU NEWS - 효빈대학교 공식 뉴스룸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        #header-area img { max-height: 40px !important; width: auto !important; object-fit: contain !important; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <!-- 공통 헤더 자동 렌더링 영역 -->
    <div id="header-area"></div>

    <main class="max-w-6xl mx-auto px-4 py-12 flex-grow w-full">
        <!-- 상단 헤더 및 검색 바 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 border-b-2 border-[#3344aa] pb-5 gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="bg-[#3344aa] text-white text-xs font-black px-2.5 py-0.5 rounded">HBNU PRESS</span>
                    <span class="text-xs text-gray-400 font-bold">홍보처 · 대외협력팀 공식 뉴스룸</span>
                </div>
                <h1 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight">HBNU NEWS (전체 뉴스 아카이브)</h1>
                <p class="text-gray-600 text-sm mt-1">효빈대학교의 생생한 학사, 연구, 캠퍼스 문화 및 글로컬 혁신 소식을 전해드립니다.</p>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <div class="relative flex-grow md:w-64">
                    <input type="text" id="news-search" oninput="filterNews(this.value)" placeholder="뉴스 키워드 검색 (예: 트램, 시장, HAF)..." class="w-full pl-9 pr-4 py-2.5 text-xs md:text-sm border border-gray-300 rounded-xl outline-none focus:border-[#3344aa] bg-white">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3"></i>
                </div>
                <select id="category-filter" onchange="filterCategory(this.value)" class="py-2.5 px-3 text-xs md:text-sm border border-gray-300 rounded-xl outline-none bg-white font-bold text-gray-700">
                    <option value="ALL">전체 분류</option>
                    <option value="대학성과">대학성과</option>
                    <option value="학술·연구">학술·연구</option>
                    <option value="캠퍼스문화">캠퍼스문화</option>
                    <option value="교통·시설">교통·시설</option>
                    <option value="총장실">총장실</option>
                </select>
            </div>
        </div>

        <!-- 뉴스 카드 그리드 리스트 (총 20개) -->
        <div id="news-container" class="space-y-5"></div>

        <!-- 더보기 버튼 -->
        <div class="flex justify-center mt-12">
            <button onclick="loadMoreNews()" id="load-more-btn" class="px-6 py-3 bg-white border border-gray-300 rounded-xl hover:bg-gray-100 text-gray-700 font-bold text-sm shadow-sm transition-all flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4 text-[#3344aa]"></i> 뉴스 더 불러오기
            </button>
        </div>
    </main>

    <!-- 뉴스 상세 모달 (팝업용) -->
    <div id="news-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4" onclick="closeNewsModal()">
        <div class="bg-white rounded-2xl max-w-3xl w-full overflow-hidden shadow-2xl border border-gray-200 flex flex-col max-h-[90vh]" onclick="event.stopPropagation()">
            <div class="bg-[#1e2a78] text-white px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span id="modal-badge" class="bg-[#99dd88] text-[#1e2a78] text-xs font-black px-2.5 py-1 rounded">대학성과</span>
                    <h3 id="modal-title" class="text-base md:text-lg font-black truncate max-w-lg"></h3>
                </div>
                <button onclick="closeNewsModal()" class="text-gray-300 hover:text-white p-1"><i data-lucide="x" width="22"></i></button>
            </div>
            <div class="bg-slate-100 px-6 py-2.5 text-xs text-gray-600 border-b flex justify-between">
                <span id="modal-dept"></span>
                <span id="modal-date"></span>
            </div>
            <div class="p-6 md:p-8 overflow-y-auto space-y-5">
                <div id="modal-img-wrap" class="rounded-xl overflow-hidden bg-slate-900 max-h-80 hidden">
                    <img id="modal-img" src="" alt="" class="w-full h-72 object-cover">
                </div>
                <div id="modal-summary" class="p-4 bg-blue-50 border-l-4 border-[#3344aa] font-bold text-xs md:text-sm text-[#1e2a78] rounded-r-lg"></div>
                <div id="modal-body" class="text-gray-800 leading-7 text-sm md:text-[15px] whitespace-pre-line"></div>
            </div>
            <div class="bg-gray-50 px-6 py-3.5 border-t flex justify-between items-center text-xs text-gray-500">
                <span>효빈대학교 홍보처 보도자료 (무단 전재 및 재배포 금지)</span>
                <button onclick="closeNewsModal()" class="bg-[#3344aa] text-white px-5 py-2 rounded-xl font-bold">확인 및 닫기</button>
            </div>
        </div>
    </div>

    <!-- 공통 푸터 자동 렌더링 영역 -->
    <footer id="footer-area" class="bg-[#2a2a2a] text-gray-400 py-12 text-sm mt-auto"></footer>

    <!-- 핵심: 공통 스크립트 연결 -->
    <script src="common.js"></script>
    <script>
        // ================= 효빈대학교 공식 뉴스 데이터베이스 (총 20건) =================
        const HBNU_NEWS_20 = [
            {
                id: 1, category: "대학성과", hot: true,
                title: "효빈대학교, 『중앙일보 대학평가 종합 8위』 달성… 국립대 최상위권 위상 및 3년 연속 유지취업률 1위",
                summary: "2023년 11위 ➔ 2024년 9위 ➔ 2025~2026년 평가에서 8위 수직 상승. 사회복지학·철도교통학·서브컬처 문화융합·통합의학(메디컬 그랜드슬램) 전 분야 S등급 석권.",
                date: "2026.11.05", dept: "홍보처 · 기획처",

            },
            {
                id: 2, category: "총장실", hot: true,
                title: "박효빈 효빈광역시장(사회복지정책학 15), 모교 베르데 홀 4,950석 만석 특강… '연결의 행정' 강조",

            {

                        <img src="${n.img}" alt="${n.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600'">
                        <span class="absolute top-3 left-3 bg-[#3344aa] text-white text-[11px] font-extrabold px-2.5 py-1 rounded-full shadow">${n.category}</span>
                        ${n.hot ? '<span class="absolute top-3 right-3 bg-red-600 text-white text-[11px] font-black px-2.5 py-1 rounded-full shadow">HOT</span>' : ''}
                    </div>
                    <div class="md:w-2/3 flex flex-col justify-between">
                        <div>
                            <h2 class="text-lg md:text-xl font-bold text-gray-900 group-hover:text-[#3344aa] mb-2.5 leading-snug transition-colors">${n.title}</h2>
                            <p class="text-gray-600 text-xs md:text-sm leading-relaxed line-clamp-3">${n.summary}</p>
                        </div>
                        <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-100 text-xs text-gray-500">
                            <span class="font-bold text-gray-700">${n.dept}</span>
                            <span>${n.date}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            const loadBtn = document.getElementById('load-more-btn');
            if (visibleCount >= filtered.length) {
                loadBtn.style.display = 'none';
            } else {
                loadBtn.style.display = 'inline-flex';
            }

            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function filterNews(val) {
            visibleCount = 8;
            renderNewsList();
        }

        function filterCategory(val) {
            visibleCount = 8;
            renderNewsList();
        }

        function loadMoreNews() {
            visibleCount += 6;
            renderNewsList();
        }

        // 뉴스 상세 모달 제어
        function openNewsModal(id) {
            const item = HBNU_NEWS_20.find(n => n.id === id);
            if (!item) return;

            document.getElementById('modal-badge').innerText = item.category;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-dept').innerHTML = `<strong>취재·보도:</strong> ${item.dept}`;
            document.getElementById('modal-date').innerHTML = `<strong>보도일자:</strong> ${item.date}`;
            document.getElementById('modal-summary').innerText = item.summary;
            document.getElementById('modal-body').innerText = item.content;

            const imgWrap = document.getElementById('modal-img-wrap');
            const imgEl = document.getElementById('modal-img');
            if (item.img) {
                imgEl.src = item.img;
                imgWrap.classList.remove('hidden');
            } else {
                imgWrap.classList.add('hidden');
            }

            document.getElementById('news-modal').classList.remove('hidden');
            document.getElementById('news-modal').classList.add('flex');
        }

        function closeNewsModal() {
            document.getElementById('news-modal').classList.add('hidden');
            document.getElementById('news-modal').classList.remove('flex');
        }
    </script>
</body>
</html>
