<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스 상세 - 효빈대학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <header class="bg-white border-b py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <a href="hbnu_main.html" class="flex items-center text-[#3344aa] font-bold text-xl">
                <img src="https://imgur.com/Uvf0SqH.png" onerror="this.src='https://via.placeholder.com/32?text=H'" class="w-8 h-8 mr-2 rounded-md">
                효빈대학교
            </a>
            <a href="hbnu_news_list.html" class="text-sm text-gray-500 hover:text-[#3344aa] font-medium flex items-center">
                <i data-lucide="list" class="w-4 h-4 mr-1"></i> 뉴스 목록
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        <div id="news-content-area" class="bg-white border rounded-xl shadow-sm overflow-hidden p-8">
            <div id="loader" class="text-center py-20">뉴스를 불러오는 중...</div>
        </div>
    </main>

    <script>
        const NEWS_DB = {
            1: {
                title: "박효빈 시장, 모교 방문해 '지방대학의 혁신' 특강",
                date: "2025.02.05",
                dept: "대외협력팀",
                img: "https://images.unsplash.com/photo-1544531586-fde5298cdd40?w=1000",
                content: "박효빈 효빈광역시장이 지난 5일 모교인 효빈대학교를 방문했습니다. 박 시장은 강연에서 '개천에서 용 나는 사회'를 만들기 위해 대학과 시가 어떻게 협력해야 하는지 자신의 철학을 공유했습니다."
            },
            2: {
                title: "[학술] 도시공학과 연구팀, 우수 논문상 수상",
                date: "2025.02.04",
                dept: "산학협력단",
                img: "https://images.unsplash.com/photo-1560264280-88b68371db39?w=1000",
                content: "도시공학과 김철도 교수팀이 '효빈 트램 도입에 따른 탄소 저감 효과 분석' 논문으로 학회 우수 논문상을 수상했습니다. 이 연구는 효빈시의 미래 교통 정책 수립에 큰 기여를 했다는 평가입니다."
            }
        };

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const area = document.getElementById('news-content-area');
            
            if (id && NEWS_DB[id]) {
                const n = NEWS_DB[id];
                area.innerHTML = `
                    <h1 class="text-3xl font-bold text-gray-900 mb-4">${n.title}</h1>
                    <div class="flex items-center text-sm text-gray-500 mb-8 border-b pb-4">
                        <span class="mr-4 font-bold text-[#3344aa]">${n.dept}</span>
                        <span>${n.date}</span>
                    </div>
                    ${n.img ? `<img src="${n.img}" class="w-full rounded-lg mb-8 shadow-md">` : ''}
                    <div class="text-lg text-gray-700 leading-loose whitespace-pre-line">${n.content}</div>
                    <div class="mt-12 text-center">
                        <button onclick="goHome()" class="px-8 py-3 bg-[#3344aa] text-white rounded-lg font-bold">홈으로</button>
                    </div>
                `;
            } else {
                area.innerHTML = "해당 뉴스를 찾을 수 없습니다.";
            }
            lucide.createIcons();
        };
        function goHome() { location.href = 'hbnu_main.html'; }
    </script>
</body>
</html>
